<!DOCTYPE html>
<html lang="en-US">
<head>

<meta name="viewport" content="width=device-width, user-scalable=yes, initial-scale=1.0">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<title>{{ title }}</title>
<meta name="site-base" content="{{ site_base }}">
<link rel="icon" href="/wp-content/uploads/2017/08/PARC_final-1.png" type="image/png">

{% include 'head-assets.html' %}
</head>
<body class="{{ body_class }}" itemscope itemtype="http://schema.org/WebPage">

<div id="content" class="cryout">

</div>
{% include 'footer.html' %}

{% include 'body-scripts.html' %}

</body>
</html>
